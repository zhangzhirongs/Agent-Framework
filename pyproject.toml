[project]
name = "agent-framework"
version = "0.1.0"
description = "A minimal configurable agent starter with standard skills and MCP"
requires-python = ">=3.11"
dependencies = [
  "openai-agents>=0.23.1,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.35,<1",
  "pydantic-settings>=2.10,<3",
  "python-dotenv>=1,<2",
  "mcp>=2,<3",
  "httpx>=0.28,<1",
  "argon2-cffi>=23,<26",
  "pyyaml>=6,<7",
  "python-multipart>=0.0.20,<1",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
  "Pillow>=11,<13",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
